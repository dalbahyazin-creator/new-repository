# Bloc memberships as of the as_of date below.
# - members lists ISO3 codes. Countries can carry since / until years so the year slider shows past membership.
# - Institutional members (the EU in the G20, for example) go in a note, not in members.
# - Every bloc cites its official member page.
# - Edit this file as memberships change, then rerun `make data`.
as_of: "2026-11"
blocs:
  EU:
    name: European Union
    type: political-economic union
    source: https://european-union.europa.eu/principles-countries-history/eu-countries_en
    members: [AUT, BEL, BGR, HRV, CYP, CZE, DNK, EST, FIN, FRA, DEU, GRC, HUN, IRL, ITA, LVA, LTU, LUX, MLT, NLD, POL, PRT, ROU, SVK, SVN, ESP, SWE]
    former: { GBR: { since: 1973, until: 2020 } }
    since: { DNK: 1973, IRL: 1973, GRC: 1981, ESP: 1986, PRT: 1986, HRV: 2013, BGR: 2007, ROU: 2007, CYP: 2004, CZE: 2004, EST: 2004, HUN: 2004, LVA: 2004, LTU: 2004, MLT: 2004, POL: 2004, SVK: 2004, SVN: 2004, AUT: 1995, FIN: 1995, SWE: 1995 }
  EA:
    name: Euro area
    type: monetary union
    source: https://www.ecb.europa.eu/euro/intro/html/index.en.html
    members: [AUT, BEL, BGR, HRV, CYP, EST, FIN, FRA, DEU, GRC, IRL, ITA, LVA, LTU, LUX, MLT, NLD, PRT, SVK, SVN, ESP]
    since: { BGR: 2026, HRV: 2023, LTU: 2015, LVA: 2014, EST: 2011, SVK: 2009, CYP: 2008, MLT: 2008, SVN: 2007, GRC: 2001 }
  G7:
    name: Group of Seven
    type: forum
    source: https://www.g7italy.it/en/the-g7/
    members: [CAN, FRA, DEU, ITA, JPN, GBR, USA]
    note: The EU takes part as a non-enumerated member.
  G20:
    name: Group of Twenty
    type: forum
    source: https://g20.org/about-the-g20/
    members: [ARG, AUS, BRA, CAN, CHN, FRA, DEU, IND, IDN, ITA, JPN, KOR, MEX, RUS, SAU, ZAF, TUR, GBR, USA]
    note: The European Union and the African Union (member since 2023) are institutional members and are not listed as countries.
  BRICS:
    name: BRICS
    type: forum
    source: https://brics.br/en/about-brics
    members: [BRA, RUS, IND, CHN, ZAF, EGY, ETH, IRN, ARE, IDN]
    since: { ZAF: 2011, EGY: 2024, ETH: 2024, IRN: 2024, ARE: 2024, IDN: 2025 }
    note: Saudi Arabia was invited in 2023 but has not confirmed membership, so it is excluded.
  BRICS_PARTNERS:
    name: BRICS partner countries
    type: forum (partner tier)
    source: https://brics.br/en/about-brics
    members: [BLR, BOL, KAZ, CUB, MYS, THA, UGA, UZB, NGA, VNM]
    since: { BLR: 2025, BOL: 2025, KAZ: 2025, CUB: 2025, MYS: 2025, THA: 2025, UGA: 2025, UZB: 2025, NGA: 2025, VNM: 2025 }
  OPEC:
    name: Organization of the Petroleum Exporting Countries
    type: commodity cartel
    source: https://www.opec.org/opec_web/en/about_us/25.htm
    members: [DZA, COG, GNQ, GAB, IRN, IRQ, KWT, LBY, NGA, SAU, ARE, VEN]
    former: { AGO: { until: 2023 }, ECU: { until: 2019 }, QAT: { until: 2018 } }
  OPEC_PLUS:
    name: OPEC+ (Declaration of Cooperation)
    type: commodity cartel
    source: https://www.opec.org/opec_web/en/press_room/declaration-of-cooperation.htm
    members: [DZA, COG, GNQ, GAB, IRN, IRQ, KWT, LBY, NGA, SAU, ARE, VEN, AZE, BHR, BRN, KAZ, MYS, MEX, OMN, RUS, SDN, SSD]
