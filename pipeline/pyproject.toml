[project]
name = "worldatlas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas==2.2.3", "pyarrow==18.1.0", "pyyaml==6.0.2", "requests==2.32.3", "pyshp==2.3.1"]
[project.optional-dependencies]
dev = ["pytest==8.3.4"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["worldatlas"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to source hosts"]
